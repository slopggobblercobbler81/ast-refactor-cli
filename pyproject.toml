[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-refactor-cli"
version = "0.1.0"
description = "A fast developer CLI for safe AST-based symbol renaming, automated function extraction, and syntax modernization across Python and JavaScript codebases."
readme = "README.md"
authors = [
    { name = "slopggobblercobbler81" }
]
license = { text = "MIT" }
keywords = ["ast", "refactoring", "linter", "renaming", "function-extraction", "modernization", "python", "javascript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/ast-refactor-cli"
Repository = "https://github.com/slopggobblercobbler81/ast-refactor-cli"
Issues = "https://github.com/slopggobblercobbler81/ast-refactor-cli/issues"

[project.scripts]
ast-refactor = "ast_refactor.cli:main"
